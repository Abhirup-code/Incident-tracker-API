services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incidents_user
      POSTGRES_PASSWORD: incidents_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents_user -d incidents"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://incidents_user:incidents_pass@db:5432/incidents
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

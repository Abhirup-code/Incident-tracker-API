# Example only. Do not commit real secrets to git.
# Create the real secret with:
#   kubectl create secret generic incident-tracker-secret \
#     --namespace incident-tracker \
#     --from-literal=DATABASE_URL='postgresql+psycopg://user:pass@host:5432/incidents'
apiVersion: v1
kind: Secret
metadata:
  name: incident-tracker-secret
  namespace: incident-tracker
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://incidents_user:incidents_pass@postgres:5432/incidents"
